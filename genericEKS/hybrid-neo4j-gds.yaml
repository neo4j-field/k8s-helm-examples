
image:
#
  imagePullPolicy: "Always"
  # Using the official multi-arch Neo4j Enterprise image (works on the ARM64
  # nodegroups here) instead of a custom image -- the customImage below lived
  # in a different AWS account (766746056086) with no cross-account ECR pull
  # access granted to this cluster's account, so it 403'd. Unlike that custom
  # image, the official one doesn't have GDS baked in, so NEO4J_PLUGINS below
  # is uncommented to install it.
  #customImage: "766746056086.dkr.ecr.us-east-2.amazonaws.com/drose-repo:neo4j-aeb281g240-5.9.0-enterprise-arm"
  #customImage: "766746056086.dkr.ecr.us-east-2.amazonaws.com/drose-repo:neo4j-axeb211g254-5.13.0-enterprise-arm"
  #If a custom domain is in use
#clusterDomain: "neo4j.cluster.local"

neo4j:
  # Must match neo4j-core.yaml's neo4j.name: this sets the "app" label
  # used by the chart's Kubernetes-based cluster-discovery service. A
  # different name here isolates the GDS secondaries into their own discovery
  # group -- they can only ever see each other, never the PRIMARY members, so
  # they hang forever trying to join a cluster they can't discover.
  name: "neo4j-hybrid-cluster"
  resources:
    cpu: 1.5
    memory: "7G"
  # Uncomment to set the initial password
  #password: ""
  passwordFromSecret: "neo4jpwd"
  offlineMaintenanceModeEnabled: false
  # Uncomment to use enterprise edition
  edition: "enterprise"
  acceptLicenseAgreement: "yes"
  minimumClusterSize: "3"

nodeSelector:
  eks.amazonaws.com/nodegroup: "neo4j-small"

env:
  NEO4J_PLUGINS: '["graph-data-science", "bloom", "apoc"]'

services:
  neo4j:
    enabled: false

podSpec:
  loadbalancer: "exclude"

config:
  server.backup.enabled: "true"
  server.config.strict_validation.enabled: "false"
  db.logs.query.enabled: "OFF"
  server.directories.licenses: "/licenses/local"
  dbms.bloom.license_file: "/licenses/local/bloom.license"
  dbms.security.procedures.unrestricted: "apoc.*,bloom.*,gds.*"
  server.unmanaged_extension_classes: "com.neo4j.bloom.server=/bloom"
  dbms.security.http_auth_allowlist: "/,/browser.*,/bloom.*"
  server.directories.plugins: "/var/lib/neo4j/plugins"
  server.memory.heap.initial_size: "4G"
  server.memory.heap.max_size: "4G"
  server.memory.pagecache.size: "1G"
  server.directories.transaction.logs.root: /transactions
  initial.server.mode_constraint: "SECONDARY"
  server.cluster.system_database_mode: "SECONDARY"
  db.tx_log.rotation.retention_policy: "1 hours"
  initial.server.tags: "gds"


apoc_config:
  apoc.export.file.enabled: "true"
  apoc.import.file.enabled: "true"
  apoc.trigger.enabled: "true"

# Only if a custom domain is in use
#  causal_clustering.kubernetes.cluster_domain: "neo4j.cluster.local"


additionalVolumeMounts:
  - name: license-keys
    mountPath: /licenses/local
    readOnly: true

additionalVolumes:
  - name: license-keys
    configMap:
      name: license-config

volumes:
  data:
    mode: "dynamic"
    dynamic:
      storageClassName: "gp3highiops"
      requests:
        storage: 100Gi
  # uncomment to mount your efs
  import:
    mode: volume
    volume:
      setOwnerAndGroupWritableFilePermissions: true
      persistentVolumeClaim:
        claimName: pvc-efs-dynamic
  transactions:
      mode: "dynamic"
      dynamic:
        storageClassName: "gp3highiops"
        accessModes:
          - ReadWriteOnce
        requests:
          storage: 100Gi
