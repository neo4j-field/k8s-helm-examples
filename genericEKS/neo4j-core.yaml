
image:
  imagePullPolicy: "Always"
  # Using the official multi-arch Neo4j Enterprise image (works on the ARM64
  # nodegroups here) instead of a custom image -- the customImage below lived
  # in a different AWS account (766746056086) with no cross-account ECR pull
  # access granted to this cluster's account, so it 403'd.
  #customImage: "766746056086.dkr.ecr.us-east-2.amazonaws.com/drose-repo:neo4j-aeb281-5.9.0-enterprise-arm"
  #customImage: "766746056086.dkr.ecr.us-east-2.amazonaws.com/drose-repo:neo4j-axeb211-5.13.0-enterprise-arm"
#If a custom domain is in use
#clusterDomain: "neo4j.cluster.local"

# Self-signed Bolt TLS cert (shared across the whole cluster -- core and GDS
# secondaries alike) so remote database alias / driver connections can use
# neo4j+ssc:// (encrypted, no CA validation). The chart auto-derives
# dbms.ssl.policy.bolt.enabled and server.bolt.tls_level=REQUIRED from this
# block -- do NOT also set those under `config:` or the rendered ConfigMap
# will end up with duplicate keys. REQUIRED means every Bolt client (Browser,
# drivers, cypher-shell) must switch to neo4j+ssc://; plain bolt:// stops
# working once this is applied.
ssl:
  bolt:
    privateKey:
      secretName: neo4j-bolt-cert
    publicCertificate:
      secretName: neo4j-bolt-cert

neo4j:
  name: "neo4j-hybrid-cluster"
  resources:
    cpu: "7"
    memory: "28G"
  # Uncomment to set the initial password
  #password: ""
  passwordFromSecret: "neo4jpwd"
  offlineMaintenanceModeEnabled: false
  # Uncomment to use enterprise edition
  edition: "enterprise"
  acceptLicenseAgreement: "yes"
  minimumClusterSize: "3"

  labels:
    eks.amazonaws.com/nodetype: "primary"

nodeSelector:
  eks.amazonaws.com/nodegroup: "neo4j-small"

env:
   NEO4J_PLUGINS: '["bloom", "apoc"]'

services:
  neo4j:
    enabled: false

config:
  server.backup.enabled: "true"
  server.config.strict_validation.enabled: "false"
  db.logs.query.enabled: "OFF"
  server.directories.licenses: "/licenses/local"
  dbms.bloom.license_file: "/licenses/local/bloom.license"
  dbms.security.procedures.unrestricted: "apoc.*,bloom.*,gds.*"
  server.unmanaged_extension_classes: "com.neo4j.bloom.server=/bloom"
  dbms.security.http_auth_allowlist: "/,/browser.*,/bloom.*"
  server.directories.plugins: "/var/lib/neo4j/plugins"
  server.memory.heap.initial_size: "16G"
  server.memory.heap.max_size: "16G"
  server.memory.pagecache.size: "10G"
  server.directories.transaction.logs.root: /transactions
  initial.server.mode_constraint: "PRIMARY"
  initial.dbms.default_primaries_count: "3"
  # Auto-ENABLE a server as soon as it joins in the FREE state -- otherwise
  # each GDS secondary joins but stays FREE (visible in SHOW SERVERS, never
  # hosting a database) until someone manually runs ENABLE SERVER for it.
  # This decision is made by whichever core member holds system database
  # leadership, so it belongs here (neo4j-core.yaml), not in
  # hybrid-neo4j-gds.yaml -- the joining secondary's own copy of this setting
  # is never consulted.
  initial.dbms.automatically_enable_free_servers: "true"
  server.metrics.enabled: "true"
  server.metrics.csv.interval: "30s"
  server.metrics.csv.rotation.keep_number: "5"
  server.metrics.csv.rotation.compression: "NONE"
  db.tx_log.rotation.retention_policy: "1 hours"
  dbms.security.keystore.path: /keystore/neo4j.keystore
  dbms.security.keystore.password: changeit
  dbms.security.key.name: neo4j-key
  # Server-side routing: lb-neo4j-core.yaml is ONE shared LB fronting all 3
  # core pods, so the internal addresses (*.svc.cluster.local) that
  # client-side routing (the neo4j:// default) hands back are unreachable
  # from outside the cluster -- see CALL dbms.cluster.routing.getRoutingTable
  # returning those internal hostnames. default_router=SERVER makes each
  # member return a single-entry routing table (itself) and forward the
  # query internally instead, so neo4j+s/neo4j+ssc work through the one
  # shared LB. https://neo4j.com/docs/operations-manual/current/kubernetes/quickstart-cluster/access-outside-k8s/
  dbms.routing.enabled: "true"
  dbms.routing.default_router: "SERVER"
  dbms.routing.load_balancing.plugin: server_policies
  dbms.routing.load_balancing.config.server_policies.gds: tags(gds); halt();

  # Kubernetes-based cluster discovery settings, all defaults for a standard
  # in-cluster deployment -- only need overriding for a non-standard setup
  # (e.g. a custom cluster domain).
  # dbms.kubernetes.address: "kubernetes.default.svc:443"                                  # Address for Kubernetes API
  # dbms.kubernetes.ca_crt: "/var/run/secrets/kubernetes.io/serviceaccount/ca.crt"          # File location of CA certificate for Kubernetes API
  # dbms.kubernetes.cluster_domain: "cluster.local"                                         # Kubernetes cluster domain -- set this if a custom domain is in use
  # dbms.kubernetes.discovery.service_port_name: "transaction"                              # Service port name for discovery for Kubernetes API
  # dbms.kubernetes.label_selector: ""                                                      # LabelSelector for Kubernetes API -- no product default, the chart derives this automatically
  # dbms.kubernetes.namespace: "/var/run/secrets/kubernetes.io/serviceaccount/namespace"     # File location of namespace for Kubernetes API
  # dbms.kubernetes.token: "/var/run/secrets/kubernetes.io/serviceaccount/token"             # File location of token for Kubernetes API

apoc_config:
  apoc.export.file.enabled: "true"
  apoc.import.file.enabled: "true"
  apoc.trigger.enabled: "true"


additionalVolumeMounts:
  - name: license-keys
    mountPath: /licenses/local
    readOnly: true
  - name: neo4j-keystore
    mountPath: /keystore
    readOnly: true

additionalVolumes:
  - name: license-keys
    configMap:
      name: license-config
  - name: neo4j-keystore
    secret:
      secretName: neo4j-keystore

volumes:
  data:
    mode: "dynamic"
    dynamic:
      storageClassName: "gp3highiops"
      requests:
        storage: 100Gi
  # uncomment to mount your efs
  import:
    mode: volume
    volume:
      setOwnerAndGroupWritableFilePermissions: true
      persistentVolumeClaim:
        claimName: pvc-efs-dynamic
  transactions:
      mode: "dynamic"
      dynamic:
        storageClassName: "gp3highiops"
        accessModes:
          - ReadWriteOnce
        requests:
          storage: 100Gi
  