apiVersion: v1
# This is the primary load balancer - serves the 3 core members
# This requires the following in the nodepool definition of eksctl yaml
#   iam:
#     withAddonPolicies:
#        ebs: true
#        efs: true
#        awsLoadBalancerController: true
kind: Service
metadata:
  annotations:
    # requires awsLoadBalancerController: true
    # "external" hands this Service to the AWS Load Balancer Controller (must be
    # installed); the legacy "nlb" value only supports instance targets.
    # "ip" registers pod IPs directly (no NodePort/kube-proxy hop). Switching an
    # existing LB from "nlb" to "external" recreates it -- new DNS name/IPs.
    #service.beta.kubernetes.io/aws-load-balancer-type: external
    #service.beta.kubernetes.io/aws-load-balancer-nlb-target-type: ip
    service.beta.kubernetes.io/aws-load-balancer-type: nlb
    service.beta.kubernetes.io/aws-load-balancer-scheme: internet-facing
    # the next line is for internal pointing (VPC) load balancer 
    #service.beta.kubernetes.io/aws-load-balancer-scheme: "internal"
    #below not needed
    #service.beta.kubernetes.io/aws-load-balancer-ssl-ports: 443, 7687
    service.beta.kubernetes.io/aws-load-balancer-backend-protocol: tcp
    # TLS is terminated at Neo4j itself (see the ssl.https block in
    # neo4j-core.yaml, same self-signed neo4j-bolt-cert reused for HTTPS as
    # for Bolt), not at the LB -- this stays a pure TCP passthrough to
    # Neo4j's HTTPS port 7473. No ACM cert/annotation needed here for that;
    # the lines below are only for the *alternate* path of terminating TLS
    # at the LB instead, which needs a real ACM cert in this account/region.
    #service.beta.kubernetes.io/aws-load-balancer-ssl-negotiation-policy: ELBSecurityPolicy-TLS13-1-2-2021-06
    #service.beta.kubernetes.io/aws-load-balancer-ssl-cert: YOUR ACM ARN GOES HERE
    #only if you want the load balancer to continue to hit the same destination per client (sticky)
    #service.beta.kubernetes.io/aws-load-balancer-target-group-attributes: stickiness.enabled=true,stickiness.type=source_ip

  labels:
    #app: hybridgds
    eks.amazonaws.com/nodetype: "primary"
  name: neo4j-core-lb
  namespace: "neo4j-ns"
spec:
  #loadBalancerIP: 10.151.8.87
  externalTrafficPolicy: Local
  ports:
  - name: bolt
    port: 7687
    protocol: TCP
    targetPort: 7687
  - name: https
    port: 443
    protocol: TCP
    targetPort: 7473
  selector:
    # Must match neo4j-core.yaml's neo4j.name (the chart's "app" pod label)
    app: neo4j-hybrid-cluster
    eks.amazonaws.com/nodetype: "primary"
  sessionAffinity: None
  type: LoadBalancer
