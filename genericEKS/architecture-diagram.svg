<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-label="Diagram of the jhair-cluster EKS cluster showing customers-ns with 3 core members on the neo4j-small nodegroup and claims-ns with 3 core members on its own neo4j-4xlarge nodegroup, each fronted by a core-lb that routes bolt traffic to any of its PRIMARY members. Each domain's single GDS secondary pod is reached only by that domain's own gds-1-lb, and both domains' GDS pods are scheduled onto a shared gdslarge nodegroup, larger than either core nodegroup, rather than their own domain's core nodegroup. Both namespaces also still mount the same underlying AWS EFS filesystem.">
  <rect x="0" y="0" width="1200" height="760" fill="#ffffff"/>
      <defs>
        <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
          <path d="M0,0 L10,5 L0,10 z" fill="#1b2430" />
        </marker>
      </defs>

      <!-- client entry -->
      <text x="600" y="19" text-anchor="middle" font-size="12.5" font-family="IBM Plex Mono, monospace" fill="#1b2430" opacity="0.75">Neo4j Bolt / HTTP clients</text>
      <line x1="182" y1="28" x2="182" y2="57" stroke="#1b2430" stroke-width="1.4" marker-end="url(#arrow)" opacity="0.7"/>
      <line x1="387" y1="28" x2="387" y2="57" stroke="#1b2430" stroke-width="1.4" marker-end="url(#arrow)" opacity="0.7"/>
      <line x1="793" y1="28" x2="793" y2="57" stroke="#1b2430" stroke-width="1.4" marker-end="url(#arrow)" opacity="0.7"/>
      <line x1="998" y1="28" x2="998" y2="57" stroke="#1b2430" stroke-width="1.4" marker-end="url(#arrow)" opacity="0.7"/>

      <!-- LB boxes -->
      <g font-family="IBM Plex Mono, monospace">
        <rect x="90" y="60" width="185" height="50" rx="6" fill="none" stroke="#1b2430" stroke-width="1.4"/>
        <text x="182.5" y="80" text-anchor="middle" font-size="12" font-weight="600" fill="#1b2430">neo4j-core-lb</text>
        <text x="182.5" y="97" text-anchor="middle" font-size="10" fill="#1b2430" opacity="0.65">AWS NLB · bolt 7687</text>

        <rect x="295" y="60" width="185" height="50" rx="6" fill="none" stroke="#1b2430" stroke-width="1.4"/>
        <text x="387.5" y="80" text-anchor="middle" font-size="12" font-weight="600" fill="#1b2430">neo4j-gds-1-lb</text>
        <text x="387.5" y="97" text-anchor="middle" font-size="10" fill="#1b2430" opacity="0.65">non-routing bolt</text>

        <rect x="700" y="60" width="185" height="50" rx="6" fill="none" stroke="#1b2430" stroke-width="1.4"/>
        <text x="792.5" y="80" text-anchor="middle" font-size="12" font-weight="600" fill="#1b2430">neo4j-core-lb</text>
        <text x="792.5" y="97" text-anchor="middle" font-size="10" fill="#1b2430" opacity="0.65">AWS NLB · bolt 7687</text>

        <rect x="905" y="60" width="185" height="50" rx="6" fill="none" stroke="#1b2430" stroke-width="1.4"/>
        <text x="997.5" y="80" text-anchor="middle" font-size="12" font-weight="600" fill="#1b2430">neo4j-gds-1-lb</text>
        <text x="997.5" y="97" text-anchor="middle" font-size="10" fill="#1b2430" opacity="0.65">non-routing bolt</text>
      </g>

      <!-- domain column headers, sit just above cluster box -->
      <text x="305" y="125" text-anchor="middle" font-size="11" letter-spacing="0.06em" font-family="IBM Plex Mono, monospace" fill="#1b2430" opacity="0.55">CUSTOMERS DOMAIN</text>
      <text x="905" y="125" text-anchor="middle" font-size="11" letter-spacing="0.06em" font-family="IBM Plex Mono, monospace" fill="#1b2430" opacity="0.55">CLAIMS DOMAIN</text>

      <!-- core-lb -> namespace: reaches the general PRIMARY mesh, any member can serve the request -->
      <line x1="182" y1="110" x2="182" y2="188" stroke="#1b2430" stroke-width="1.4" marker-end="url(#arrow)" opacity="0.7"/>
      <text x="193" y="150" font-size="9" fill="#1b2430" opacity="0.55">routes to any</text>
      <text x="193" y="161" font-size="9" fill="#1b2430" opacity="0.55">PRIMARY</text>
      <line x1="793" y1="110" x2="793" y2="188" stroke="#1b2430" stroke-width="1.4" marker-end="url(#arrow)" opacity="0.7"/>
      <text x="804" y="150" font-size="9" fill="#1b2430" opacity="0.55">routes to any</text>
      <text x="804" y="161" font-size="9" fill="#1b2430" opacity="0.55">PRIMARY</text>

      <!-- gds-lb -> gds pod only: elbows around the core pods/mesh/PVC tag to
           land directly on the GDS pod, never touching a core pod, since
           this LB's non-routing bolt listener has exactly one backend. -->
      <path d="M387,110 L387,200 L500,200 L500,380 L355,380 L355,393" fill="none" stroke="#1b2430" stroke-width="1.4" marker-end="url(#arrow)" opacity="0.75"/>
      <text x="392" y="230" font-size="9" fill="#1b2430" opacity="0.6">bolt 7687 —</text>
      <text x="392" y="241" font-size="9" fill="#1b2430" opacity="0.6">GDS pod only</text>
      <path d="M998,110 L998,140 L1010,140 L1010,460 L955,460 L955,447" fill="none" stroke="#1b2430" stroke-width="1.4" marker-end="url(#arrow)" opacity="0.75"/>
      <text x="1020" y="200" font-size="9" fill="#1b2430" opacity="0.6">bolt 7687 —</text>
      <text x="1020" y="211" font-size="9" fill="#1b2430" opacity="0.6">GDS pod only</text>

      <!-- cluster outer -->
      <rect x="15" y="132" width="1170" height="610" rx="10" fill="none" stroke="#1b2430" stroke-width="1.4" stroke-dasharray="3 4" opacity="0.55"/>
      <text x="34" y="154" font-size="12.5" font-family="IBM Plex Mono, monospace" fill="#1b2430" opacity="0.7">EKS cluster “jhair-cluster” · us-east-2</text>

      <!-- customers namespace -->
      <g>
        <rect x="50" y="190" width="510" height="280" rx="8" fill="none" stroke="#1b2430" stroke-width="1.4"/>
        <text x="65" y="212" font-size="12" font-family="IBM Plex Mono, monospace" font-weight="600" fill="#1b2430">namespace: customers-ns</text>

        <rect x="55" y="224" width="118" height="36" rx="5" fill="none" stroke="#1b2430" stroke-width="1" opacity="0.6"/>
        <text x="114" y="238" text-anchor="middle" font-size="9.5" font-family="IBM Plex Mono, monospace" fill="#1b2430" opacity="0.75">PVC</text>
        <text x="114" y="251" text-anchor="middle" font-size="9.5" font-family="IBM Plex Mono, monospace" fill="#1b2430" opacity="0.75">pvc-efs-dynamic</text>

        <!-- mesh -->
        <text x="305" y="262" text-anchor="middle" font-size="10" fill="#1b2430" opacity="0.55">Neo4j causal cluster (raft)</text>
        <line x1="165" y1="330" x2="305" y2="300" stroke="#1b2430" stroke-width="1.1" opacity="0.55"/>
        <line x1="305" y1="300" x2="445" y2="330" stroke="#1b2430" stroke-width="1.1" opacity="0.55"/>
        <line x1="165" y1="330" x2="445" y2="330" stroke="#1b2430" stroke-width="1.1" opacity="0.55"/>

        <circle cx="165" cy="330" r="26" fill="none" stroke="#1b2430" stroke-width="1.6"/>
        <text x="165" y="335" text-anchor="middle" font-size="13" font-weight="600" fill="#1b2430">1</text>
        <circle cx="305" cy="300" r="26" fill="none" stroke="#1b2430" stroke-width="1.6"/>
        <text x="305" y="305" text-anchor="middle" font-size="13" font-weight="600" fill="#1b2430">2</text>
        <circle cx="445" cy="330" r="26" fill="none" stroke="#1b2430" stroke-width="1.6"/>
        <text x="445" y="335" text-anchor="middle" font-size="13" font-weight="600" fill="#1b2430">3</text>
        <text x="165" y="368" text-anchor="middle" font-size="10.5" font-family="IBM Plex Mono, monospace" fill="#1b2430">customers-1</text>
        <text x="305" y="338" text-anchor="middle" font-size="10.5" font-family="IBM Plex Mono, monospace" fill="#1b2430">customers-2</text>
        <text x="445" y="368" text-anchor="middle" font-size="10.5" font-family="IBM Plex Mono, monospace" fill="#1b2430">customers-3</text>
        <text x="165" y="381" text-anchor="middle" font-size="9.5" fill="#1b2430" opacity="0.55">PRIMARY</text>
        <text x="305" y="351" text-anchor="middle" font-size="9.5" fill="#1b2430" opacity="0.55">PRIMARY</text>
        <text x="445" y="381" text-anchor="middle" font-size="9.5" fill="#1b2430" opacity="0.55">PRIMARY</text>

        <!-- PV callout -->
        <rect x="55" y="360" width="112" height="34" rx="5" fill="none" stroke="#1b2430" stroke-width="1" stroke-dasharray="2 3" opacity="0.5"/>
        <text x="111" y="373" text-anchor="middle" font-size="9" font-family="IBM Plex Mono, monospace" fill="#1b2430" opacity="0.65">PV: data+txn</text>
        <text x="111" y="384" text-anchor="middle" font-size="9" font-family="IBM Plex Mono, monospace" fill="#1b2430" opacity="0.65">gp3highiops, zone-pinned</text>
        <line x1="167" y1="377" x2="165" y2="356" stroke="#1b2430" stroke-width="1" stroke-dasharray="2 3" opacity="0.5"/>

        <!-- gds -->
        <line x1="305" y1="326" x2="305" y2="395" stroke="#1b2430" stroke-width="1.2" stroke-dasharray="3 3" opacity="0.6" marker-end="url(#arrow)"/>
        <text x="316" y="362" font-size="9.5" fill="#1b2430" opacity="0.6">async replication</text>
        <rect x="235" y="395" width="140" height="50" rx="8" fill="rgba(180,99,31,0.12)" stroke="#b4631f" stroke-width="1.6"/>
        <text x="305" y="416" text-anchor="middle" font-size="11.5" font-weight="600" font-family="IBM Plex Mono, monospace" fill="#1b2430">customers-gds-1</text>
        <text x="305" y="430" text-anchor="middle" font-size="9.5" fill="#1b2430" opacity="0.7">SECONDARY · tag=gds</text>

        <!-- efs route out -->
        <path d="M55,242 L25,242 L25,662 L350,662" fill="none" stroke="#1b2430" stroke-width="1.2" stroke-dasharray="3 3" opacity="0.55" marker-end="url(#arrow)"/>

        <!-- gds -> gdslarge nodegroup: exits the GDS pod's right edge, threads
             the gap between the two domains' own nodegroup boxes so it never
             crosses either one. -->
        <path d="M375,420 L575,420 L575,565" fill="none" stroke="#1b2430" stroke-width="1.4" opacity="0.75" marker-end="url(#arrow)"/>
      </g>

      <!-- claims namespace (mirrored) -->
      <g>
        <rect x="650" y="190" width="510" height="280" rx="8" fill="none" stroke="#1b2430" stroke-width="1.4"/>
        <text x="665" y="212" font-size="12" font-family="IBM Plex Mono, monospace" font-weight="600" fill="#1b2430">namespace: claims-ns</text>

        <rect x="1027" y="224" width="118" height="36" rx="5" fill="none" stroke="#1b2430" stroke-width="1" opacity="0.6"/>
        <text x="1086" y="238" text-anchor="middle" font-size="9.5" font-family="IBM Plex Mono, monospace" fill="#1b2430" opacity="0.75">PVC</text>
        <text x="1086" y="251" text-anchor="middle" font-size="9.5" font-family="IBM Plex Mono, monospace" fill="#1b2430" opacity="0.75">pvc-efs-dynamic</text>

        <text x="905" y="262" text-anchor="middle" font-size="10" fill="#1b2430" opacity="0.55">Neo4j causal cluster (raft)</text>
        <line x1="765" y1="330" x2="905" y2="300" stroke="#1b2430" stroke-width="1.1" opacity="0.55"/>
        <line x1="905" y1="300" x2="1045" y2="330" stroke="#1b2430" stroke-width="1.1" opacity="0.55"/>
        <line x1="765" y1="330" x2="1045" y2="330" stroke="#1b2430" stroke-width="1.1" opacity="0.55"/>

        <circle cx="765" cy="330" r="26" fill="none" stroke="#1b2430" stroke-width="1.6"/>
        <text x="765" y="335" text-anchor="middle" font-size="13" font-weight="600" fill="#1b2430">1</text>
        <circle cx="905" cy="300" r="26" fill="none" stroke="#1b2430" stroke-width="1.6"/>
        <text x="905" y="305" text-anchor="middle" font-size="13" font-weight="600" fill="#1b2430">2</text>
        <circle cx="1045" cy="330" r="26" fill="none" stroke="#1b2430" stroke-width="1.6"/>
        <text x="1045" y="335" text-anchor="middle" font-size="13" font-weight="600" fill="#1b2430">3</text>
        <text x="765" y="368" text-anchor="middle" font-size="10.5" font-family="IBM Plex Mono, monospace" fill="#1b2430">claims-1</text>
        <text x="905" y="338" text-anchor="middle" font-size="10.5" font-family="IBM Plex Mono, monospace" fill="#1b2430">claims-2</text>
        <text x="1045" y="368" text-anchor="middle" font-size="10.5" font-family="IBM Plex Mono, monospace" fill="#1b2430">claims-3</text>
        <text x="765" y="381" text-anchor="middle" font-size="9.5" fill="#1b2430" opacity="0.55">PRIMARY</text>
        <text x="905" y="351" text-anchor="middle" font-size="9.5" fill="#1b2430" opacity="0.55">PRIMARY</text>
        <text x="1045" y="381" text-anchor="middle" font-size="9.5" fill="#1b2430" opacity="0.55">PRIMARY</text>

        <rect x="1033" y="360" width="112" height="34" rx="5" fill="none" stroke="#1b2430" stroke-width="1" stroke-dasharray="2 3" opacity="0.5"/>
        <text x="1089" y="373" text-anchor="middle" font-size="9" font-family="IBM Plex Mono, monospace" fill="#1b2430" opacity="0.65">PV: data+txn</text>
        <text x="1089" y="384" text-anchor="middle" font-size="9" font-family="IBM Plex Mono, monospace" fill="#1b2430" opacity="0.65">gp3highiops, zone-pinned</text>
        <line x1="1043" y1="377" x2="1045" y2="356" stroke="#1b2430" stroke-width="1" stroke-dasharray="2 3" opacity="0.5"/>

        <line x1="905" y1="326" x2="905" y2="395" stroke="#1b2430" stroke-width="1.2" stroke-dasharray="3 3" opacity="0.6" marker-end="url(#arrow)"/>
        <text x="916" y="362" font-size="9.5" fill="#1b2430" opacity="0.6">async replication</text>
        <rect x="835" y="395" width="140" height="50" rx="8" fill="rgba(180,99,31,0.12)" stroke="#b4631f" stroke-width="1.6"/>
        <text x="905" y="416" text-anchor="middle" font-size="11.5" font-weight="600" font-family="IBM Plex Mono, monospace" fill="#1b2430">claims-gds-1</text>
        <text x="905" y="430" text-anchor="middle" font-size="9.5" fill="#1b2430" opacity="0.7">SECONDARY · tag=gds</text>

        <path d="M1145,242 L1175,242 L1175,662 L850,662" fill="none" stroke="#1b2430" stroke-width="1.2" stroke-dasharray="3 3" opacity="0.55" marker-end="url(#arrow)"/>

        <!-- gds -> gdslarge nodegroup: mirrors customers', exits the GDS pod's
             left edge through the same inter-domain gap. -->
        <path d="M835,420 L625,420 L625,565" fill="none" stroke="#1b2430" stroke-width="1.4" opacity="0.75" marker-end="url(#arrow)"/>
      </g>

      <!-- schedule arrows: core pods only now (GDS pods route to gdslarge instead) (see above) -->
      <line x1="305" y1="470" x2="305" y2="499" stroke="#1b2430" stroke-width="1.6" marker-end="url(#arrow)" opacity="0.8"/>
      <text x="316" y="488" font-size="9.5" fill="#1b2430" opacity="0.65">3 PRIMARY pods</text>
      <line x1="905" y1="470" x2="905" y2="499" stroke="#1b2430" stroke-width="1.6" marker-end="url(#arrow)" opacity="0.8"/>
      <text x="916" y="488" font-size="9.5" fill="#1b2430" opacity="0.65">3 PRIMARY pods</text>

      <!-- customers' core nodegroup (dedicated, not shared) -->
      <rect x="40" y="500" width="510" height="52" rx="8" fill="none" stroke="#1b2430" stroke-width="1.4"/>
      <text x="295" y="522" text-anchor="middle" font-size="13" font-weight="600" font-family="IBM Plex Mono, monospace" fill="#1b2430">Nodegroup: neo4j-small</text>
      <text x="295" y="540" text-anchor="middle" font-size="10" fill="#1b2430" opacity="0.7">m7g.2xlarge · customers-ns core only · 3 of 8 scheduled · us-east-2a/2c</text>

      <!-- claims' core nodegroup (dedicated, not shared) -->
      <rect x="640" y="500" width="530" height="52" rx="8" fill="none" stroke="#1b2430" stroke-width="1.4"/>
      <text x="905" y="522" text-anchor="middle" font-size="13" font-weight="600" font-family="IBM Plex Mono, monospace" fill="#1b2430">Nodegroup: neo4j-4xlarge</text>
      <text x="905" y="540" text-anchor="middle" font-size="10" fill="#1b2430" opacity="0.7">r7g.4xlarge · claims-ns core only · 3 of 8 scheduled · us-east-2c only</text>

      <!-- shared gdslarge nodegroup: both domains' GDS secondaries, sized ~2x
           the core members per Neo4j's GDS memory/CPU rule of thumb -->
      <text x="600" y="458" text-anchor="middle" font-size="8.5" fill="#1b2430" opacity="0.55">GDS: 1 each ↓</text>
      <rect x="40" y="566" width="1130" height="52" rx="8" fill="rgba(180,99,31,0.12)" stroke="#b4631f" stroke-width="1.6"/>
      <text x="600" y="588" text-anchor="middle" font-size="13" font-weight="600" font-family="IBM Plex Mono, monospace" fill="#1b2430">Nodegroup: gdslarge</text>
      <text x="600" y="606" text-anchor="middle" font-size="10.5" fill="#1b2430" opacity="0.7">r6i.16xlarge (~2x a core member) · GDS secondaries for BOTH domains · 2 of 4 scheduled</text>

      <!-- shared EFS -->
      <rect x="350" y="634" width="500" height="56" rx="8" fill="rgba(180,99,31,0.12)" stroke="#b4631f" stroke-width="1.6"/>
      <text x="600" y="656" text-anchor="middle" font-size="12.5" font-weight="600" font-family="IBM Plex Mono, monospace" fill="#1b2430">AWS EFS filesystem (single instance)</text>
      <text x="600" y="674" text-anchor="middle" font-size="10" fill="#1b2430" opacity="0.7">mount targets in every node subnet · backup/import (RWX)</text>

      <!-- legend -->
      <g font-family="IBM Plex Mono, monospace" font-size="9.5" fill="#1b2430" opacity="0.6">
        <line x1="1020" y1="134" x2="1038" y2="134" stroke="#1b2430" stroke-width="1.1"/>
        <text x="1043" y="137">raft / replication</text>
        <line x1="1020" y1="150" x2="1038" y2="150" stroke="#1b2430" stroke-width="1.1" stroke-dasharray="3 3"/>
        <text x="1043" y="153">indirect link</text>
        <rect x="1020" y="161" width="14" height="10" fill="rgba(180,99,31,0.12)" stroke="#b4631f" stroke-width="1"/>
        <text x="1043" y="170">shared resource</text>
      </g>
    </svg>
