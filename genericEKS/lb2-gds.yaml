apiVersion: v1
kind: Service
metadata:
  annotations:
    # "external" hands this Service to the AWS Load Balancer Controller (must be
    # installed); the legacy "nlb" value only supports instance targets.
    # "ip" registers pod IPs directly (no NodePort/kube-proxy hop). Switching an
    # existing LB from "nlb" to "external" recreates it -- new DNS name/IPs.
    #service.beta.kubernetes.io/aws-load-balancer-type: external
    #service.beta.kubernetes.io/aws-load-balancer-nlb-target-type: ip
    service.beta.kubernetes.io/aws-load-balancer-type: nlb
    service.beta.kubernetes.io/aws-load-balancer-scheme: internet-facing
    #service.beta.kubernetes.io/aws-load-balancer-ssl-ports: 443, 7687
    service.beta.kubernetes.io/aws-load-balancer-backend-protocol: tcp
    # TLS is terminated at Neo4j itself (see the ssl.https block in
    # hybrid-neo4j-gds.yaml, same self-signed neo4j-bolt-cert reused for
    # HTTPS as for Bolt), not at the LB -- this stays a pure TCP passthrough
    # to Neo4j's HTTPS port 7473. No ACM cert/annotation needed here for
    # that; the lines below are only for the *alternate* path of
    # terminating TLS at the LB instead, which needs a real ACM cert in
    # this account/region (the ARN below was for a different account,
    # 766746056086, and won't validate here anyway).
    #service.beta.kubernetes.io/aws-load-balancer-ssl-negotiation-policy: ELBSecurityPolicy-TLS13-1-2-2021-06
    #service.beta.kubernetes.io/aws-load-balancer-ssl-cert: arn:aws:acm:us-east-2:766746056086:certificate/d8abdaa0-f3f2-4e0f-806e-ce72fed79be3
    #service.beta.kubernetes.io/aws-load-balancer-target-group-attributes: stickiness.enabled=true,stickiness.type=source_ip

  labels:
    app: neo4j-hybrid-cluster
    helm.neo4j.com/instance: neo4j-gds-2
  name: neo4j-gds-2-lb
  namespace: "neo4j-ns"
spec:
  #loadBalancerIP: 10.151.8.87
  externalTrafficPolicy: Local
  ports:
  - name: bolt
    port: 7687
    protocol: TCP
    targetPort: 7687
  - name: https
    port: 443
    protocol: TCP
    targetPort: 7473
  selector:
    app: neo4j-hybrid-cluster
    helm.neo4j.com/instance: neo4j-gds-2
  sessionAffinity: None
  type: LoadBalancer
