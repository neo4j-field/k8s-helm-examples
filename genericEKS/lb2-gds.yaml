apiVersion: v1
kind: Service
metadata:
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: nlb
    service.beta.kubernetes.io/aws-load-balancer-scheme: internet-facing
    #service.beta.kubernetes.io/aws-load-balancer-ssl-ports: 443, 7687
    service.beta.kubernetes.io/aws-load-balancer-backend-protocol: tcp
    # TLS termination is DISABLED for now: there is no ACM cert in this account/region
    # (the ARN below was for AWS account 766746056086, a DIFFERENT account than the
    # one this cluster runs in -- it will not validate here). The http listener below
    # is plain port 80 -> 7474 (no encryption) until a real cert exists in this account.
    # To re-enable TLS termination at the LB: request/obtain an ACM cert ARN in this
    # region/account, change the http port below back to 443, then uncomment the next
    # two lines with that ARN filled in.
    #service.beta.kubernetes.io/aws-load-balancer-ssl-negotiation-policy: ELBSecurityPolicy-TLS13-1-2-2021-06
    #service.beta.kubernetes.io/aws-load-balancer-ssl-cert: arn:aws:acm:us-east-2:766746056086:certificate/d8abdaa0-f3f2-4e0f-806e-ce72fed79be3
    #service.beta.kubernetes.io/aws-load-balancer-target-group-attributes: stickiness.enabled=true,stickiness.type=source_ip

  labels:
    #app: hybridgds
    helm.neo4j.com/instance: neo4j-gds-2
  name: neo4j-gds-2-lb
  namespace: "neo4j-ns"
spec:
  #loadBalancerIP: 10.151.8.87
  externalTrafficPolicy: Local
  ports:
  - name: bolt
    port: 7687
    protocol: TCP
    targetPort: 7687
  - name: http
    port: 80
    protocol: TCP
    targetPort: 7474
  selector:
    helm.neo4j.com/instance: neo4j-gds-2
    #app: hybridgds
  sessionAffinity: None
  type: LoadBalancer
